  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    body {
      background-color: #0e0e0e;
      color: white;
      min-height: 100vh;
      padding: 40px 20px 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #00f0ff;
      margin-bottom: 25px;
      font-weight: 700;
      text-align: center;
      user-select: none;
    }
    /* Search bar */
    #searchBar {
      width: 320px;
      padding: 10px 15px;
      border-radius: 25px;
      border: none;
      font-size: 1rem;
      outline: none;
      box-shadow: 0 0 8px #00f0ff88 inset;
      background-color: #121212;
      color: white;
      margin-bottom: 30px;
      transition: box-shadow 0.3s ease;
    }
    #searchBar:focus {
      box-shadow: 0 0 15px #00f0ff;
    }
    /* Song list */
    .song-list {
      width: 320px;
      max-height: 480px;
      overflow-y: auto;
      border-radius: 15px;
      background-color: #121212;
      box-shadow:
        0 0 10px #00f0ff55 inset;
      padding: 10px 0;
    }
    /* Single song item */
    .song-item {
      display: flex;
      align-items: center;
      padding: 10px 15px;
      border-bottom: 1px solid #222;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .song-item:hover {
      background-color: #00f0ff22;
    }
    /* Album cover */
    .cover {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      object-fit: cover;
      margin-right: 15px;
      box-shadow: 0 0 8px #00f0ffbb;
      flex-shrink: 0;
    }
    /* Song info */
    .info {
      flex-grow: 1;
      overflow: hidden;
    }
    .title {
      font-weight: 600;
      color: #00f0ff;
      font-size: 1rem;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      user-select: none;
    }
    .artist {
      font-size: 0.85rem;
      color: #aaa;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      user-select: none;
    }
    /* Play button */
    .play-btn {
      color: #00f0ff;
      font-size: 1.4rem;
      padding-left: 15px;
      transition: color 0.2s ease;
      flex-shrink: 0;
    }
    .play-btn:hover {
      color: #0ff;
      text-shadow: 0 0 15px #0ff;
    }
    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #000;
      padding: 12px 0;
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #222;
      box-shadow: 0 0 15px #00f0ff99 inset;
      user-select: none;
      z-index: 100;
    }
    .bottom-nav a {
      color: #00f0ff;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: text-shadow 0.3s ease;
    }
    .bottom-nav a:hover {
      text-shadow: 0 0 10px #00f0ff;
    }
    .bottom-nav i {
      font-size: 1.4rem;
    }
  </style>
</head>

  const searchBar = document.getElementById("searchBar");
  const songList = document.getElementById("songList");

  // Render songs list function
  function renderSongs(songs) {
    songList.innerHTML = ""; // clear existing

    if (songs.length === 0) {
      songList.innerHTML = `<p style="color:#777; text-align:center; padding:20px;">No songs found</p>`;
      return;
    }

    songs.forEach((song, index) => {
      const songDiv = document.createElement("div");
      songDiv.classList.add("song-item");

      // Clicking anywhere on item also plays
      songDiv.addEventListener("click", () => {
        goToPlayer(index);
      });

      // Album cover img
      const coverImg = document.createElement("img");
      coverImg.src = song.cover;
      coverImg.alt = song.title + " cover";
      coverImg.classList.add("cover");

      // Song info container
      const infoDiv = document.createElement("div");
      infoDiv.classList.add("info");

      const titleEl = document.createElement("div");
      titleEl.classList.add("title");
      titleEl.textContent = song.title;

      const artistEl = document.createElement("div");
      artistEl.classList.add("artist");
      artistEl.textContent = song.artist;

      infoDiv.appendChild(titleEl);
      infoDiv.appendChild(artistEl);

      // Play button icon
      const playBtn = document.createElement("i");
      playBtn.classList.add("fas", "fa-play", "play-btn");
      playBtn.title = "Play " + song.title;
      playBtn.addEventListener("click", (e) => {
        e.stopPropagation(); // prevent bubbling to songDiv click
        goToPlayer(index);
      });

      songDiv.appendChild(coverImg);
      songDiv.appendChild(infoDiv);
      songDiv.appendChild(playBtn);

      songList.appendChild(songDiv);
    });
  }

  // Search filter
  searchBar.addEventListener("input", () => {
    const query = searchBar.value.toLowerCase();
    const filteredSongs = playlist.filter(
      (song) =>
        song.title.toLowerCase().includes(query) ||
        song.artist.toLowerCase().includes(query)
    );
    renderSongs(filteredSongs);
  });

  // Redirect to player with song index in URL query param
  function goToPlayer(index) {
    // Pass index as query param "song"
    window.location.href = `player.html?song=${index}`;
  }

  // Initially render full list
  renderSongs(playlist);
</script>
